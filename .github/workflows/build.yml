name: Build EVChargeBill APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract EVChargeBill project
        run: |
          unzip -o EVChargeBill_Android_Project.zip -d /tmp/evproject
          cp -R /tmp/evproject/. .
          rm -rf /tmp/evproject
          rm -f EVChargeBill_Android_Project.zip

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add EVChargeBill Android project" || true
          git push || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVChargeBill-APK
          path: app/build/outputs/apk/debug/app-debug.apk
